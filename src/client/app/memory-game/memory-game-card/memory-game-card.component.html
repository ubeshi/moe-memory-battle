@let cardSlot = _cardSlot();
@let card = cardSlot.card;
@let cardText = _cardText();
<div
  [ngClass]="{ 'flip': cardSlot.shownFace === CardFace.FRONT }"
  class="w-full h-full rounded-md border border-solid border-gray-700 shadow-sm mmb-card"
>
  <ng-container *ngTemplateOutlet="cardBack"/>
  <ng-container *ngTemplateOutlet="cardFront"/>
</div>

<ng-template #cardFront>
  <div class="mmb-card-front">
    <div *ngIf="_frontImage" class="rounded">
      <img class="img-fluid" [src]="_frontImage" alt="card front"/>
      <span [ngClass]="[effectIcon, 'icon']"></span>
    </div>
    <span *ngIf="!_frontImage">{{ cardText }}</span>
  </div>
</ng-template>

<ng-template #cardBack>
  <div class="mmb-card-back">
    <img *ngIf="_backImage" class="img-fluid rounded" [src]="_backImage" alt="card back"/>
    <div *ngIf="!_backImage" class="w-full h-full flex justify-center items-center card-back-pattern">
      <span>?</span>
    </div>
  </div>
</ng-template>
