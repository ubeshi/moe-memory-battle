@let cardSlots = _cardSlots();
<div class="card-hand-container">
  <div class="flex justify-center items-center card-hand">
    @for (cardSlot of cardSlots; track $index; let position = $index) {
      <div class="card-slot">
        <mmb-memory-game-card
          #cardElement
          role="button"
          [cardSlot]="cardSlot"
          (click)="handlePositionClicked(position, cardElement.elementRef)"
        ></mmb-memory-game-card>
      </div>
    }
  </div>
</div>
