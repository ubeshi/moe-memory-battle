<mat-card class="p-4">
  <mat-card-title>{{ card.name }}</mat-card-title>
  <mat-card-content>
    <div class="flex flex-col gap-4">
      @for (ability of card.abilities; track $index) {
        <div>
          <strong>{{ ability.name }}</strong>: {{ ability.description }}
        </div>
      }
    </div>
  </mat-card-content>

  <mat-card-actions align="end" class="flex gap-4">
    <button mat-raised-button
      (click)="handleCloseClicked()"
    >
      Close
    </button>
  </mat-card-actions>
</mat-card>
