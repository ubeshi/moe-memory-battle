@let memoryGame = _memoryGame();
@let field = memoryGame.field;
<div class="grid grid-cols-8">
  @for (fieldSlot of field.slots; track $index; let fieldSlotIndex = $index) {
    @switch (fieldSlot.type) {
      @case (FieldSlotType.CARD) {
        <div class="card-slot aspect-square">
          @let cardFieldSlot = fieldSlot;
          <mmb-memory-game-card
            #cardElement
            class="mmb-card aspect-square"
            role="button"
            [cardSlot]="cardFieldSlot.cardSlot"
            (click)="handlePositionClicked(fieldSlotIndex, cardElement.elementRef)"
          />
        </div>
      }
      @case (FieldSlotType.EMPTY) {
        <mmb-memory-game-empty-slot
          #emptySlotElement
          role="button"
          (click)="handlePositionClicked(fieldSlotIndex, emptySlotElement.elementRef)"
        />
      }
    }
  }
</div>
